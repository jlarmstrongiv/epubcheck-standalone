name: CI

on:
  push:
    branches: [main]
    # Monorepo: only the packages (and the shared toolchain / this workflow)
    # affect the from-source build. Demo-only changes don't run CI.
    paths:
      - "packages/epubcheck-standalone/**"
      - "packages/epubcheck-standalone-cli/**"
      - "mise.toml"
      # Root wiring that governs the build/consistency gates.
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".npmrc"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/epubcheck-standalone/**"
      - "packages/epubcheck-standalone-cli/**"
      - "mise.toml"
      # Root wiring that governs the build/consistency gates.
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".npmrc"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  # Allow the release workflow to reuse this exact build+test gate.
  workflow_call:

# ENGINE ARTIFACT: REBUILD FROM SOURCE, no committed artifact to diff against.
# The engine (dist/epubcheck-engine.js) is EPUBCheck 5.3.0 compiled to plain
# JavaScript by TeaVM's JS backend (`gradle generateJavaScript` + the
# fix-generated.ts post-processor). Both dist/ and teavm/build/ are gitignored
# (`git ls-files` shows zero engine files), and every suite imports the freshly
# built dist/epubcheck-engine.js. So there is nothing committed to diff a
# rebuild against: CI compiles the engine from Java with the mise-pinned
# toolchain (Temurin JDK 21 + Gradle 9.7.1) and runs the full battery against
# that fresh build. That from-source rebuild is the drift protection.
#
# STRUCTURE: the engine is built ONCE in `build`, which uploads dist/ as an
# artifact; the two slow suites then run in PARALLEL (library-tests ‖ cli-tests),
# each downloading that same dist instead of recompiling. The release workflow
# reuses this whole gate and its `publish` job downloads the same artifact, so
# the engine is compiled exactly once per release and the published bytes are
# the exact bytes the gate tested.
#
# Runner OS: ubuntu-latest. TeaVM emits plain, host-independent JavaScript, so
# the engine byte-for-byte does not depend on the build host. The toolchain
# (Node + Temurin JDK 21 + Gradle) comes from mise, which installs the correct
# platform binaries automatically.
jobs:
  # Compile the engine + library + CLI once, type-check, build the web demo, and
  # hand the built dist/ to the test jobs (and, in a release run, to publish).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cache the mise-managed toolchain (Node + Temurin JDK 21 + Gradle),
      # keyed on mise.toml so a toolchain bump busts the cache.
      - name: Cache mise toolchain
        uses: actions/cache@v6
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}

      # Cache the Gradle dependency store (TeaVM plugin + classlib jars pulled
      # from Maven Central by the engine compile), keyed on the engine build
      # definition so an engine-toolchain change busts it.
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/epubcheck-standalone/teavm/build.gradle.kts', 'packages/epubcheck-standalone/teavm/gradle.properties', 'packages/epubcheck-standalone/teavm/build-shims.sh') }}

      # Provisions the WHOLE toolchain from mise.toml (Node + Temurin JDK 21 +
      # Gradle) and exports its [env] table (EPUBCHECK_VERSION, JZLIB_VERSION)
      # and PATH to the steps that follow, so `npm run build:deps` / `npm run build`
      # see the pinned build-input versions and the pinned java/gradle.
      - name: Provision toolchain with mise
        uses: jdx/mise-action@v4
        with:
          install: true

      # npm ci installs the WHOLE workspace from the root lockfile, under the
      # npm 12 that mise (above) provisions as a core tool ahead of Node 24's
      # bundled npm 11.
      - name: Install workspace (root lockfile)
        run: npm ci --no-audit --no-fund

      # Single-source-of-truth consistency (engines by package kind, exact pins,
      # internal-dep pinning, shared epubcheck version). Cheap; fail fast.
      - name: Version consistency check
        run: npm run check:versions

      # Fetch build INPUTS only (epubcheck release + JZlib; apply the Jing
      # patch). The toolchain already came from mise above.
      - name: Fetch build inputs
        run: npm run build:deps

      # Compile the engine from Java with TeaVM (gradle generateJavaScript ->
      # fix-generated.ts -> dist/epubcheck-engine.js) and the TypeScript library
      # into dist/. This is the from-source engine rebuild the whole battery
      # runs against -- built ONCE here and shared with the test jobs below.
      - name: Build engine + library from source (TeaVM)
        run: npm run build

      # Compile the CLI TypeScript into its own dist/ so the artifact carries a
      # ready-to-publish CLI too (the release publish job ships it without rebuilding).
      - name: Build CLI
        run: npm run build --workspace epubcheck-standalone-cli

      # Type-check the CLI's own test sources so test-only type regressions are
      # caught in CI.
      - name: Type-check CLI tests
        run: npm run typecheck:tests --workspace epubcheck-standalone-cli

      # Type-check the library's test/testing/scripts sources.
      - name: Type-check library tests and scripts
        run: npm run check:types --workspace epubcheck-standalone

      # Build the web package against the freshly built library (paraglide
      # compile + astro build). Exercises the web package's TypeScript through
      # the Astro/Vite build.
      - name: Build web
        run: npm run web:build

      # Bundle the built dist dirs into ONE tarball so downstream jobs restore
      # the exact paths (a plain tar avoids upload-artifact's common-ancestor
      # path rewriting). Contains the engine, the compiled library, and the
      # compiled CLI.
      - name: Bundle built dist for downstream jobs
        run: tar -czf dist-bundle.tgz packages/epubcheck-standalone/dist packages/epubcheck-standalone-cli/dist

      - name: Upload dist bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: dist-bundle.tgz
          retention-days: 1
          if-no-files-found: error

  # Full library battery (parity + reports + every library suite) against the
  # engine built in `build`. Runs in parallel with cli-tests.
  library-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise provides Node + npm AND Temurin JDK 21: the jar-parity suites run
      # the real epubcheck.jar to compare against, so java is required here.
      - name: Cache mise toolchain
        uses: actions/cache@v6
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}

      - name: Provision toolchain with mise
        uses: jdx/mise-action@v4
        with:
          install: true

      # node_modules the suites import (e.g. @aws-sdk/client-s3 for the S3 test).
      - name: Install workspace (root lockfile)
        run: npm ci --no-audit --no-fund

      # The jar the parity/reports/flags/url suites compare against (build:deps
      # fetches epubcheck.jar). EPUBCHECK_REQUIRE_JAR below turns jar-absent into
      # a hard FAIL, so the jar must be present.
      - name: Fetch build inputs (jar for parity)
        run: npm run build:deps

      # Restore the engine + compiled library built in `build` (skip recompiling).
      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle

      - name: Unpack dist bundle
        run: tar -xzf dist-bundle.tgz

      # smoke, validate, reuse, memory-plateau (bounded RSS across 30 warm runs),
      # engine-error-cleanup, abort, 446-book parity, report byte-parity, flags,
      # expanded, custom-messages, url, s3, http-bridge. (npm test re-runs the
      # library's tsc build:ts for the compiled-TS part; the engine comes from
      # the downloaded dist.)
      - name: Library battery (parity + reports + all library suites)
        run: npm run test --workspace epubcheck-standalone
        env:
          CONCURRENCY: "4"
          EPUBCHECK_REQUIRE_JAR: "1"

  # CLI golden suite against the engine built in `build`. Runs in parallel with
  # library-tests. No jar needed: it diffs against the frozen jar-derived goldens.
  cli-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache mise toolchain
        uses: actions/cache@v6
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}

      - name: Provision toolchain with mise
        uses: jdx/mise-action@v4
        with:
          install: true

      - name: Install workspace (root lockfile)
        run: npm ci --no-audit --no-fund

      # The CLI drives the library engine, so it needs the library dist. (The CLI
      # suite rebuilds its own CLI dist via its test script; the downloaded CLI
      # dist is for the release publish job, not needed here.)
      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle

      - name: Unpack dist bundle
        run: tar -xzf dist-bundle.tgz

      - name: CLI golden suite
        run: npm run test --workspace epubcheck-standalone-cli
