# Deploy the static web site (packages/epubcheck-standalone-web) to GitHub Pages.
#
# This is the web half of the tag-push publish path (release.yml publishes the
# npm packages; this deploys the public web site), so the two update together when a
# release tag is pushed. It also runs on manual dispatch.
#
# This workflow does nothing until the repo is pushed to GitHub AND Pages is
# enabled for it (Settings -> Pages -> Build and deployment -> GitHub Actions).
#
# Pages is served from this repo, so the public URL is
# https://jlarmstrongiv.github.io/epubcheck-standalone/ (base set in the Astro config).
name: Deploy web to GitHub Pages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-latest: the web package imports the library through its exports map
    # (epubcheck-standalone for validate(), /plugins, /parse, and the TeaVM engine
    # JS), which resolve to dist/. dist/ is a gitignored build artifact, so the
    # library is compiled FROM SOURCE here first -- the engine from Java with
    # TeaVM (gradle) plus the TypeScript into dist/ -- which needs the full mise
    # toolchain (Node + Temurin JDK 21 + Gradle), the same runner CI uses. TeaVM
    # emits host-independent plain JavaScript, so Linux produces the same engine.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cache the mise-managed toolchain (Node + Temurin JDK 21 + Gradle),
      # keyed on mise.toml so a toolchain bump busts the cache.
      - name: Cache mise toolchain
        uses: actions/cache@v6
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/epubcheck-standalone/teavm/build.gradle.kts', 'packages/epubcheck-standalone/teavm/gradle.properties', 'packages/epubcheck-standalone/teavm/build-shims.sh') }}

      # Provisions the WHOLE toolchain from mise.toml (Node + Temurin JDK 21 +
      # Gradle) and exports its [env] table + PATH, so Node here is the pinned
      # one and the engine build sees the pinned java/gradle -- no separate
      # setup-node needed.
      - name: Provision toolchain with mise
        uses: jdx/mise-action@v4
        with:
          install: true

      # Install the WHOLE workspace from the root lockfile so the web package's
      # `epubcheck-standalone` dependency is linked to packages/epubcheck-standalone.
      - name: Install workspace (root lockfile)
        run: npm ci --no-audit --no-fund

      # Fetch the library build inputs (epubcheck release + JZlib; patch Jing).
      - name: Fetch build inputs
        run: npm run build:deps

      # Compile the engine from Java with TeaVM and the library TypeScript into
      # dist/, so the web package can import epubcheck-standalone (its main entry),
      # /plugins, and /parse as real ESM plus the TeaVM engine JS.
      - name: Build engine + library from source (TeaVM)
        run: npm run build

      # Build packages/epubcheck-standalone-web against the freshly built
      # library (paraglide compile + astro build).
      - name: Build web
        run: npm run web:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./packages/epubcheck-standalone-web/dist
          # Short-lived: this artifact is consumed by the deploy job in the same
          # run, so it never needs to outlive it. Keeps github-pages artifacts
          # from piling up across releases.
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
